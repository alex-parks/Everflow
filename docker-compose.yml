version: '3.8'

services:
  # Main backend API gateway - routes requests to appropriate services
  backend-gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: vfx-backend-gateway
    ports:
      - "4005:4005"
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
      - HUNYUAN_IMAGE_SERVICE=http://hunyuan-image:4006
      - HUNYUAN3D_SERVICE=http://hunyuan3d:4007
    command: uvicorn gateway:app --host 0.0.0.0 --port 4005 --reload
    depends_on:
      - hunyuan-image
      - hunyuan3d

  # Hunyuan Image 2.1 Service (PyTorch 2.6+)
  hunyuan-image:
    build:
      context: .
      dockerfile: Dockerfile.hunyuan-image
    container_name: vfx-hunyuan-image
    ports:
      - "4006:4006"
    volumes:
      - ./backend/HunyuanImage-2.1:/app/HunyuanImage-2.1
      - ./backend/hunyuan_image_service.py:/app/hunyuan_image_service.py
      - ./outputs:/app/outputs
      - hunyuan_cache:/root/.cache/huggingface
    devices:
      - nvidia.com/gpu=all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
      - CUDA_VISIBLE_DEVICES=0,1

  # Hunyuan3D 2.1 Service (PyTorch 2.1.2)
  hunyuan3d:
    build:
      context: .
      dockerfile: Dockerfile.hunyuan3d
    container_name: vfx-hunyuan3d
    ports:
      - "4007:4007"
    volumes:
      - ./backend/Hunyuan3D-2.1:/app/Hunyuan3D-2.1
      - ./backend/hunyuan3d_service.py:/app/hunyuan3d_service.py
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    devices:
      - nvidia.com/gpu=all
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HUGGINGFACE_HUB_TOKEN=${HF_TOKEN}

  # Frontend development server
  frontend-dev:
    image: docker.io/library/node:18-alpine
    container_name: vfx-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    depends_on:
      - backend-gateway
    environment:
      - VITE_API_URL=http://localhost:4005

volumes:
  frontend_node_modules:
  hunyuan_cache: